name: 每日事件采集与飞书推送

# 北京时间 = UTC+8。
# 准点触发已交给 BIGApush 的 Cloudflare Worker（每天 20:33 派发 workflow_dispatch），
# 这里的 schedule 只作兜底：GitHub cron 实测会延迟 4h 以上、偶有整档丢弃。
# 兜底档靠 .push-state/ledger.json 按「运行当日 + slot=2033」判重，补档不会重复刷屏。
# 兜底全部收敛在当天（不跨午夜）：台账 edition 用运行日期，跨日会算成新档重复推送。
# 非交易日（周末/节假日）由 scripts/is_trading_day.py 直接跳过，不推昨天的榜单。

on:
  schedule:
    - cron: '33 12 * * 1-5'   # 北京 20:33 主档（收盘后，与 Worker PLAN 对齐）
    - cron: '33 13 * * 1-5'   # 21:33 兜底 (+1h)
    - cron: '33 14 * * 1-5'   # 22:33 兜底 (+2h)
    - cron: '33 15 * * 1-5'   # 23:33 兜底 (+3h，当天最后一档)
  workflow_dispatch:
    inputs:
      force:
        description: '忽略台账判重，强制再推一次'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-collect
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  # 告警机器人独立于业务机器人：业务 webhook 挂掉时告警还能发得出去
  FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
  FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
  ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
  ALERT_SECRET: ${{ secrets.ALERT_SECRET }}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      data_changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 安装 Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 交易日预检
        id: trading
        run: python scripts/is_trading_day.py

      - name: 台账判重（同档期只推一次）
        id: ledger
        if: steps.trading.outputs.is_trading == 'true'
        run: python scripts/push_ledger.py --check --workflow daily.yml --slot 2033 ${{ inputs.force && '--force' || '' }}

      - name: 非交易日提示
        if: steps.trading.outputs.is_trading != 'true'
        run: echo "::notice::非交易日，已跳过采集与推送"

      - name: 本档期已推送提示
        if: steps.trading.outputs.is_trading == 'true' && steps.ledger.outputs.should_push != 'true'
        run: echo "::notice::本档期已推送成功，本次为补档跳过（要重推用 workflow_dispatch 勾选 force）"

      - name: 采集事件数据
        if: steps.trading.outputs.is_trading == 'true' && steps.ledger.outputs.should_push == 'true'
        run: python scripts/fetch_data.py

      - name: 推送到飞书
        if: steps.trading.outputs.is_trading == 'true' && steps.ledger.outputs.should_push == 'true'
        env:
          # 与 limit-up-relay / BIGApush 统一用 PAGES_URL；PAGE_URL 为旧名，保留回落避免老配置失效
          PAGES_URL: ${{ secrets.PAGES_URL || secrets.PAGE_URL }}
        run: python scripts/notify_feishu.py --slot 2033 ${{ inputs.force && '--force' || '' }}

      - name: 回写数据快照与推送台账
        id: commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ .push-state/ || true
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: 每日快照 $(date -u +%F)" --no-verify
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 失败告警
        if: failure()
        run: python scripts/alert.py "⚠️ A股事件雷达：每日采集/推送任务失败" || true

      - name: 取消或超时告警
        if: always() && job.status == 'cancelled'
        run: python scripts/alert.py "⚠️ A股事件雷达：job 被取消或超时（failure() 不会触发）" || true

  # 用 GITHUB_TOKEN 提交的 commit 不会触发 pages.yml（GitHub 防递归机制），
  # 所以每日数据更新后必须在本流程内部自己发一次 Pages，否则线上站点永远停在旧数据。
  deploy:
    needs: collect
    if: needs.collect.outputs.data_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - name: 检出仓库（取最新 main，含刚提交的快照）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: 配置 Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: 上传静态站点
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: '.'

      - name: 部署
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
