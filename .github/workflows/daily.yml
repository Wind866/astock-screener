name: 每日事件采集

# 北京时间 = UTC+8。
# 2026-11-19 起停用全部飞书推送：榜单推送与失败/跨日告警步骤均已移除。
# 本工作流现在只做交易日事件数据的采集、快照回写与 Pages 看板部署，
# 不再往飞书发送任何消息。
#
# 准点触发由 BIGApush 的 Cloudflare Worker（20:33 派发 workflow_dispatch）负责；
# GitHub schedule 仅作兜底：实测延迟 4h 以上、偶有整档丢弃。兜底档靠
# .push-state/ledger.json 按「运行当日 + slot=2033」判重，补档不会重复采集。
# 兜底全部收敛在当天（不跨午夜）：台账 edition 用运行日期，跨日会算成新档期，
# 因此内置「跨日守卫」——被延迟拖到次日的档期直接跳过、不采集（force 可绕过）。
# 非交易日（周末/节假日）由 scripts/is_trading_day.py 直接跳过。

on:
  schedule:
    - cron: '33 12 * * 1-5'   # 北京 20:33 主档（收盘后，与 Worker PLAN 对齐）
    - cron: '33 13 * * 1-5'   # 21:33 兜底 (+1h)
    - cron: '33 14 * * 1-5'   # 22:33 兜底 (+2h)
    - cron: '33 15 * * 1-5'   # 23:33 兜底 (+3h，当天最后一档)
  workflow_dispatch:
    inputs:
      force:
        description: '忽略台账判重，强制再采集一次'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-collect
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      data_changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 安装 Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 交易日预检
        id: trading
        run: python scripts/is_trading_day.py

      # 当天任务当天完成：20:33 收盘后档（兜底最晚 23:33）必须当天跑完。
      # 台账 edition 用运行当天的日期；若 GitHub cron 把档期延迟拖到次日才触发
      # （实测可晚 4~10h），edition 会算成新的一天 → 上一交易日的数据被重复写入。
      # 这里在采集之前判红跳过，不静默补跑；force 人工触发不受限。
      - name: 跨日守卫（当天任务当天完成）
        id: crossday
        if: github.event_name == 'schedule' && inputs.force != true
        run: |
          HOUR=$(TZ=Asia/Shanghai date +%H)
          # 主档 20:33、兜底收在 23:33；北京 00:00~19:59 触发说明是前一日档期被拖过午夜。
          if [ "$HOUR" -lt 20 ]; then
            NOW=$(TZ=Asia/Shanghai date +'%F %H:%M')
            REASON="事件采集跨日运行：北京时间 $NOW 触发，已过当日 20:33~23:33 档期窗口；按「当天任务当天完成」规则跳过采集（飞书告警已停用，不静默补跑上一交易日）"
            echo "CROSS_REASON=$REASON" >> "$GITHUB_ENV"
            echo "::error::$REASON"
            exit 1
          fi
          echo "当天运行，跨日守卫通过（北京时间 $(TZ=Asia/Shanghai date +'%F %H:%M')）"

      - name: 台账判重（同档期只采集一次）
        id: ledger
        if: steps.trading.outputs.is_trading == 'true'
        run: python scripts/push_ledger.py --check --workflow daily.yml --slot 2033 ${{ inputs.force && '--force' || '' }}

      - name: 非交易日提示
        if: steps.trading.outputs.is_trading != 'true'
        run: echo "::notice::非交易日，已跳过采集"

      - name: 本档期已采集提示
        if: steps.trading.outputs.is_trading == 'true' && steps.ledger.outputs.should_push != 'true'
        run: echo "::notice::本档期已采集成功，本次为补档跳过（要重采集用 workflow_dispatch 勾选 force）"

      - name: 采集事件数据
        if: steps.trading.outputs.is_trading == 'true' && steps.ledger.outputs.should_push == 'true'
        run: python scripts/fetch_data.py

      - name: 回写数据快照与推送台账
        id: commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ .push-state/ || true
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: 每日快照 $(date -u +%F)" --no-verify

          pushed=false
          for i in 1 2 3; do
            if git push; then pushed=true; break; fi
            echo "::warning::第 $i 次 git push 失败，rebase 后重试"
            if ! git pull --rebase --autostash origin main; then
              git rebase --abort 2>/dev/null || true
            fi
          done

          if [ "$pushed" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "::error::快照与推送台账推送失败：本次数据未入库，下一档可能重复采集"
          exit 1

  # 用 GITHUB_TOKEN 提交的 commit 不会触发 pages.yml（GitHub 防递归机制），
  # 所以每日数据更新后必须在本流程内部自己发一次 Pages，否则线上站点永远停在旧数据。
  deploy:
    needs: collect
    if: needs.collect.outputs.data_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - name: 检出仓库（取最新 main，含刚提交的快照）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: 配置 Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: 上传静态站点
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: '.'

      - name: 部署
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
