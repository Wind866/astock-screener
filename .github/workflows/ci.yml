name: CI

# 公开仓库的两条底线：
#   1. 不许提交真实 webhook（拿到就能往群里发消息，爬虫抓得很快）
#   2. 数据文件与字段映射不许静默坏掉（前端会白屏而不是报错）
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: 语法检查
        run: python -m compileall -q scripts tests

      - name: 守护测试（webhook 泄露 / 数据结构 / 归一化 / 加签 / 工作流 YAML）
        run: |
          pip install --quiet pyyaml
          python -m unittest discover -s tests -v

      - name: Action 版本固定检查
        run: |
          if grep -rnE 'uses:[[:space:]]*[^[:space:]#]+@v[0-9]' .github/workflows --include='*.yml'; then
            echo "::error::存在未固定到 commit SHA 的 Action，请改为 @<sha> # vN"
            exit 1
          fi
          echo "全部 Action 已固定到 commit SHA"
