version: 2
# 与 BIGApush / etf-feishu-push / limit-up-relay 保持同一套策略：
# Action 用 SHA 固定，靠 dependabot 每周提 PR 才不会被忘在旧版本；
# 依赖按 ecosystem 独立配额，避免跨大版本升级占满槽位导致安全补丁开不出 PR。
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "chore(deps)"
    # akshare 钉死 ==1.20.42：collectors 依赖其列名与字段名，上游改一次字段
    # 就会静默取到空数据。升级必须人工改 requirements + 跑一次 daily.yml 实测。
    # 只拦版本更新，安全公告仍会正常开 PR。
    #
    # pandas 拦主版本：requirements 里 <3 的上界是刻意的（BIGApush 同款），
    # pandas 3 的 Copy-on-Write 与 dtype 变更会打断取数链路，必须人工评估后
    # 同步改流程再放开，不能由机器人每周开一个 PR。2.x 的补丁与安全更新不受影响。
    ignore:
      - dependency-name: "akshare"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "pandas"
        update-types:
          - "version-update:semver-major"
